plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.radiorubka.bitperfect'
    compileSdk 36

    defaultConfig {
        applicationId "com.radiorubka.bitperfect"
        minSdk 29
        //noinspection ExpiredTargetSdkVersion
        targetSdk 29
        versionCode 5705
        versionName "5.7.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables.useSupportLibrary = true
    }

    // Only the app's own languages: Material and AppCompat bring strings for ~80 locales (most of resources.arsc).
    androidResources {
        localeFilters += ["en", "uk"]
    }

    buildTypes {
        // R8 on the debug build too: unshrunk Material + AppCompat + Kotlin is ~16 MB of dex inside a
        // Magisk module. The app calls no hidden API (only su and plain views), so the reason this project
        // ships debug builds - R8 stripping hidden-API calls - does not bite here; our package is kept whole.
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // Disables the check for newer library versions
        disable 'GradleDependency'
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
